name: Release
on:
  push:
    branches: [main]
  # Run by hand to push only the Artifact Hub metadata of every chart.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  # renovate: datasource=github-releases depName=helm/helm
  HELM_VERSION: v4.3.2

jobs:
  release-please:
    # Opens/updates the release PR; on its merge, tags and creates the
    # GitHub releases. The app token makes the release PR trigger CI.
    name: Release PR
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      paths_released: ${{ steps.release.outputs.paths_released }}
    steps:
      - uses: actions/create-github-app-token@v3.3.0
        id: app-token
        with:
          client-id: ${{ vars.MAHAHE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.MAHAHE_BOT_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Publish ${{ matrix.path }}
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # attach the packaged chart to the GitHub release
      packages: write   # push to GHCR
    strategy:
      fail-fast: false
      matrix:
        path: ${{ fromJSON(needs.release-please.outputs.paths_released) }}
    env:
      CHART_PATH: ${{ matrix.path }}
      OCI_REPO: ghcr.io/${{ github.repository_owner }}/helm
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: azure/setup-helm@v5.1.0
        with:
          version: ${{ env.HELM_VERSION }}

      - uses: oras-project/setup-oras@v2.0.3

      - name: Log in to GHCR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          echo "$TOKEN" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Package and push
        id: chart
        run: |
          name=$(yq '.name' "$CHART_PATH/Chart.yaml")
          version=$(yq '.version' "$CHART_PATH/Chart.yaml")
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$(yq '.dependencies | length' "$CHART_PATH/Chart.yaml")" != "0" ]]; then
            helm dependency build "$CHART_PATH"
          fi
          helm package "$CHART_PATH" -d dist
          helm push "dist/$name-$version.tgz" "oci://$OCI_REPO"

      # Artifact Hub reads repository metadata from the artifacthub.io tag of
      # each OCI repository.
      - name: Push Artifact Hub metadata
        run: .github/artifacthub/push.sh "${{ steps.chart.outputs.name }}"

      - name: Attach chart to the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NAME: ${{ steps.chart.outputs.name }}
          VERSION: ${{ steps.chart.outputs.version }}
        run: gh release upload "$NAME-$VERSION" "dist/$NAME-$VERSION.tgz" --clobber

  artifacthub-metadata:
    name: Artifact Hub metadata
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push the artifacthub.io tags to GHCR
    env:
      OCI_REPO: ghcr.io/${{ github.repository_owner }}/helm
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: oras-project/setup-oras@v2.0.3

      - name: Log in to GHCR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push Artifact Hub metadata
        run: .github/artifacthub/push.sh $(yq -N '.name' charts/*/Chart.yaml)
