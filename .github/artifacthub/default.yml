# Artifact Hub repository metadata, pushed by .github/artifacthub/push.sh as the
# artifacthub.io tag of each chart's OCI repository. For a new chart: add it on
# Artifact Hub (organization mahahe-it), copy this to <chart>.yml with its
# repositoryID for the Verified Publisher badge, then run the Release workflow
# by hand (workflow_dispatch) to push the metadata without a release.
owners:
  - name: MaHaHe DevOps
    email: devops@mahahe.it
