name: Bug report
description: A chart does not install, renders wrong manifests or the app misbehaves because of the chart
labels: ["Bug"]
body:
  - type: dropdown
    id: chart
    attributes:
      label: Chart
      # Keep in step with charts/
      options:
        - foundry-vtt
        - mahahe-website
        - prometheus-haproxy-exporter
        - prometheus-pve-exporter
        - youtrack
    validations:
      required: true
  - type: input
    id: chart-version
    attributes:
      label: Chart version
      description: "`helm list` shows it, e.g. 1.0.1"
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Kubernetes and Helm versions
      placeholder: Kubernetes 1.34, Helm 4.3
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Include error messages, `helm template` output or pod logs.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
  - type: textarea
    id: values
    attributes:
      label: Values
      description: The values you set (`helm get values <release>`). Remove passwords, license keys and other secrets.
      render: yaml
