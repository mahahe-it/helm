{{- if and (.Capabilities.APIVersions.Has "monitoring.coreos.com/v1") .Values.serviceMonitor.enabled }}
{{- if not .Values.serviceMonitor.targets }}
{{- fail "serviceMonitor.targets needs at least one Proxmox VE host" }}
{{- end }}
{{- $labels := merge (deepCopy .Values.serviceMonitor.labels) (include "prometheus-pve-exporter.labels" . | fromYaml) }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "prometheus-pve-exporter.fullname" . }}
  namespace: {{ .Values.serviceMonitor.namespace | default .Release.Namespace | quote }}
  labels:
    {{- toYaml $labels | nindent 4 }}
spec:
  endpoints:
    {{- range .Values.serviceMonitor.targets }}
    - port: http
      path: /pve
      {{- with $.Values.serviceMonitor.interval }}
      interval: {{ . }}
      {{- end }}
      {{- with $.Values.serviceMonitor.timeout }}
      scrapeTimeout: {{ . }}
      {{- end }}
      params:
        target:
          - {{ . | quote }}
        {{- with $.Values.serviceMonitor.params }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      relabelings:
        - targetLabel: instance
          replacement: {{ . | quote }}
    {{- end }}
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace | quote }}
  selector:
    matchLabels:
      {{- include "prometheus-pve-exporter.selectorLabels" . | nindent 6 }}
{{- end }}
