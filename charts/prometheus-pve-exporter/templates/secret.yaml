{{- if not .Values.pve.existingSecret }}
{{- $pve := dict "user" .Values.pve.user "verify_ssl" .Values.pve.verify_ssl }}
{{- if .Values.pve.token_name }}
{{- $_ := set $pve "token_name" .Values.pve.token_name }}
{{- $_ := set $pve "token_value" .Values.pve.token_value }}
{{- else if .Values.pve.password }}
{{- $_ := set $pve "password" .Values.pve.password }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "prometheus-pve-exporter.fullname" . }}
  labels:
    {{- include "prometheus-pve-exporter.labels" . | nindent 4 }}
type: Opaque
stringData:
  pve.yml: |
    {{- dict "default" $pve | toYaml | nindent 4 }}
{{- end }}
