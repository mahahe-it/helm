{{- if gt (int .Values.replicaCount) 1 }}
{{- fail "YouTrack runs a single instance, replicaCount must be 0 or 1" }}
{{- end }}
{{- include "youtrack.upgradeGuard" . }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "youtrack.fullname" . }}
  labels:
    {{- include "youtrack.labels" . | nindent 4 }}
spec:
  {{- /* serviceName and selector are immutable: unchanged since 1.x */}}
  serviceName: {{ include "youtrack.name" . }}
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "youtrack.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "youtrack.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            {{- range $name := list "data" "conf" "logs" "backups" }}
            - name: {{ $name }}
              mountPath: /opt/youtrack/{{ $name }}
            {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- /* volumeClaimTemplates are immutable: the defaults render as in 1.x */}}
  volumeClaimTemplates:
    {{- range $name := list "data" "conf" "logs" "backups" }}
    {{- $vol := index $.Values.persistence $name }}
    - metadata:
        name: {{ $name }}
      spec:
        accessModes:
          {{- toYaml $vol.accessModes | nindent 10 }}
        {{- with $vol.storageClass | default $.Values.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ $vol.size }}
    {{- end }}
