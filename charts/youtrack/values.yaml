# Default values for youtrack.
# Every value documented with "# --" ends up in the README (helm-docs).

# -- Number of YouTrack pods: YouTrack runs a single instance, so 1, or 0 to stop it (e.g. to restore a backup)
# @section -- Common Parameters
replicaCount: 1
# -- Partially override the fullname (keeps the release name)
# @section -- Common Parameters
nameOverride: ""
# -- Fully override the fullname
# @section -- Common Parameters
fullnameOverride: ""

image:
  # -- Image repository
  # @section -- Image Parameters
  repository: jetbrains/youtrack
  # -- Image tag, defaults to the chart appVersion. Set it to step through the intermediate versions of an upgrade (see Upgrading)
  # @section -- Image Parameters
  tag: ""
  # -- Image pull policy
  # @section -- Image Parameters
  pullPolicy: IfNotPresent

# -- Pull secrets for a private registry
# @section -- Image Parameters
imagePullSecrets: []

service:
  # -- Service type
  # @section -- Service Parameters
  type: ClusterIP
  # -- Service port; it forwards to YouTrack on 8080
  # @section -- Service Parameters
  port: 8080

# -- Host names routed to YouTrack by the Ingress and the HTTPRoute; required when either is enabled
# @section -- Routing Parameters
hostnames: []

ingress:
  # -- Create an Ingress
  # @section -- Routing Parameters
  enabled: false
  # -- IngressClass name; empty uses the cluster default
  # @section -- Routing Parameters
  className: ""
  # -- Ingress annotations, e.g. `cert-manager.io/cluster-issuer`
  # @section -- Routing Parameters
  annotations: {}
  # -- TLS configuration, e.g. `[{secretName: youtrack-tls, hosts: [youtrack.example.com]}]`
  # @section -- Routing Parameters
  tls: []

# Gateway API, the alternative to the Ingress: needs the Gateway API CRDs and
# a Gateway to attach to. TLS is configured on the Gateway listener.
httpRoute:
  # -- Create an HTTPRoute (gateway.networking.k8s.io/v1)
  # @section -- Routing Parameters
  enabled: false
  # -- Gateways the route attaches to, e.g. `[{name: public, namespace: gateway, sectionName: https}]`; required when enabled
  # @section -- Routing Parameters
  parentRefs: []
  # -- HTTPRoute annotations
  # @section -- Routing Parameters
  annotations: {}

# The StatefulSet keeps data, conf, logs and backups on one PVC each. Its
# volumeClaimTemplates cannot change on an existing release: see Upgrading.
persistence:
  # -- Storage class for every volume; empty uses the cluster default. NFS is not supported by YouTrack
  # @section -- Storage Parameters
  storageClass: ""
  data:
    # -- Size of the data volume (database)
    # @section -- Storage Parameters
    size: 10Gi
    # -- Storage class of the data volume, overrides `persistence.storageClass`
    # @section -- Storage Parameters
    storageClass: ""
    # -- Access modes of the data volume
    # @section -- Storage Parameters
    accessModes: [ReadWriteOnce]
  conf:
    # -- Size of the conf volume
    # @section -- Storage Parameters
    size: 1Gi
    # -- Storage class of the conf volume, overrides `persistence.storageClass`
    # @section -- Storage Parameters
    storageClass: ""
    # -- Access modes of the conf volume
    # @section -- Storage Parameters
    accessModes: [ReadWriteOnce]
  logs:
    # -- Size of the logs volume
    # @section -- Storage Parameters
    size: 2Gi
    # -- Storage class of the logs volume, overrides `persistence.storageClass`
    # @section -- Storage Parameters
    storageClass: ""
    # -- Access modes of the logs volume
    # @section -- Storage Parameters
    accessModes: [ReadWriteOnce]
  backups:
    # -- Size of the backups volume
    # @section -- Storage Parameters
    size: 10Gi
    # -- Storage class of the backups volume, overrides `persistence.storageClass`
    # @section -- Storage Parameters
    storageClass: ""
    # -- Access modes of the backups volume
    # @section -- Storage Parameters
    accessModes: [ReadWriteOnce]

# -- Pod security context: the image runs as 13001:13001
# @section -- Security Parameters
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 13001
  runAsGroup: 13001
  fsGroup: 13001

# -- Readiness probe. There is no liveness probe: a restart during a database upgrade would break it
# @section -- Advanced Parameters
readinessProbe:
  tcpSocket:
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10

# -- Container resources. YouTrack needs at least 1.5 GB of RAM and recommends 2 CPUs
# @section -- Advanced Parameters
resources: {}

# -- Extra pod annotations
# @section -- Advanced Parameters
podAnnotations: {}

# -- Node selector
# @section -- Advanced Parameters
nodeSelector: {}

# -- Tolerations
# @section -- Advanced Parameters
tolerations: []

# -- Affinity
# @section -- Advanced Parameters
affinity: {}
