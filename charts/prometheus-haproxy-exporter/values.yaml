# Default values for prometheus-haproxy-exporter.
# Every value documented with "# --" ends up in the README (helm-docs).

# -- Number of exporter pods
# @section -- Common Parameters
replicaCount: 1

serviceAccount:
  # -- Create a ServiceAccount
  # @section -- Common Parameters
  create: true
  # -- ServiceAccount name; generated from the fullname template when empty and `create` is true
  # @section -- Common Parameters
  name:

image:
  # -- Image repository
  # @section -- Image Parameters
  repository: quay.io/prometheus/haproxy-exporter
  # -- Image tag, defaults to the chart appVersion
  # @section -- Image Parameters
  tag: ""
  # -- Image pull policy
  # @section -- Image Parameters
  pullPolicy: IfNotPresent

service:
  # -- Service type
  # @section -- Service Parameters
  type: ClusterIP
  # -- Service port of the metrics endpoint
  # @section -- Service Parameters
  port: 9101

# Ref: https://kubernetes.io/docs/concepts/services-networking/ingress/
ingress:
  # -- Create an Ingress for the exporter
  # @section -- Ingress Parameters
  enabled: false
  # -- Ingress annotations, e.g. for cert-manager
  # @section -- Ingress Parameters
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  # -- Path served by the Ingress
  # @section -- Ingress Parameters
  path: /
  # -- Ingress host names (list of strings)
  # @section -- Ingress Parameters
  hosts:
    # - chart-example.local
  # -- Ingress TLS configuration
  # @section -- Ingress Parameters
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

# Ref: https://github.com/prometheus/haproxy_exporter#usage
haproxy:
  # -- Verify the TLS certificate of the HAProxy stats endpoint; `false` adds `--no-haproxy.ssl-verify`
  # @section -- HAProxy Parameters
  verify_ssl: false
  # -- HAProxy stats URI to scrape (`--haproxy.scrape-uri`)
  # @section -- HAProxy Parameters
  scrapeUri: https://haproxy.example.com/haproxy?stats;csv
  # -- Extra arguments for the exporter
  # @section -- HAProxy Parameters
  ExtraArgs: []

resources:
  # -- Resource limits of the exporter container, e.g. `{cpu: 100m, memory: 128Mi}`
  # @section -- Advanced Parameters
  limits: {}
  # -- Resource requests of the exporter container
  # @section -- Advanced Parameters
  requests: {}

# -- Node selector for the exporter pods
# @section -- Advanced Parameters
nodeSelector: {}

# -- Tolerations for the exporter pods
# @section -- Advanced Parameters
tolerations: []

# -- Affinity for the exporter pods
# @section -- Advanced Parameters
affinity: {}

# -- Extra labels added to the ServiceMonitor
# @section -- Advanced Parameters
extraLabels: {}

# Prometheus Operator ServiceMonitor, created only when its CRD is installed.
# Ref: https://prometheus-operator.dev/docs/api-reference/api/#monitoring.coreos.com/v1.Endpoint
serviceMonitor:
  # -- Create a ServiceMonitor for the Prometheus Operator
  # @section -- ServiceMonitor Parameters
  enabled: false
  # -- Namespace of the ServiceMonitor, defaults to the release namespace
  # @section -- ServiceMonitor Parameters
  namespace:
  # -- Scrape interval
  # @section -- ServiceMonitor Parameters
  interval: 30s
  # -- Extra labels for the ServiceMonitor, e.g. the one your Prometheus selects on
  # @section -- ServiceMonitor Parameters
  labels: {}
  # -- Scrape timeout
  # @section -- ServiceMonitor Parameters
  timeout: 10s
