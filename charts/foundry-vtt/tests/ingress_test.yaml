suite: ingress
templates:
  - ingress.yaml
release:
  name: vtt
tests:
  - it: is off by default
    asserts:
      - hasDocuments:
          count: 0

  - it: routes the host to the service
    set:
      ingress.enabled: true
      ingress.hostname: vtt.example.com
    asserts:
      - isKind:
          of: Ingress
      - equal:
          path: spec.rules[0].host
          value: vtt.example.com
      - equal:
          path: spec.rules[0].http.paths[0].backend.service.name
          value: vtt-foundry-vtt

  - it: renders several annotations (#32)
    set:
      ingress.enabled: true
      ingress.annotations:
        cert-manager.io/cluster-issuer: letsencrypt
        nginx.ingress.kubernetes.io/proxy-body-size: 100m
    asserts:
      - equal:
          path: metadata.annotations
          value:
            cert-manager.io/cluster-issuer: letsencrypt
            nginx.ingress.kubernetes.io/proxy-body-size: 100m

  - it: adds TLS for the host
    set:
      ingress.enabled: true
      ingress.hostname: vtt.example.com
      ingress.tls: true
    asserts:
      - equal:
          path: spec.tls[0].secretName
          value: vtt-foundry-vtt-tls
      - contains:
          path: spec.tls[0].hosts
          content: vtt.example.com

  - it: sets the ingress class from ingress.className
    set:
      ingress.enabled: true
      ingress.className: nginx
    asserts:
      - equal:
          path: spec.ingressClassName
          value: nginx

  - it: still accepts the old ingress.ingressClassName
    set:
      ingress.enabled: true
      ingress.ingressClassName: traefik
    asserts:
      - equal:
          path: spec.ingressClassName
          value: traefik

  - it: leaves the class to the cluster default when unset
    set:
      ingress.enabled: true
    asserts:
      - notExists:
          path: spec.ingressClassName

  - it: routes every host in hostnames, with TLS for all of them
    set:
      hostnames: [vtt.example.com, foundry.example.com]
      ingress.enabled: true
      ingress.hostname: ignored.example.com
      ingress.tls: true
    asserts:
      - lengthEqual:
          path: spec.rules
          count: 2
      - equal:
          path: spec.rules[1].host
          value: foundry.example.com
      - equal:
          path: spec.rules[1].http.paths[0]
          value:
            pathType: Prefix
            path: /
            backend:
              service:
                name: vtt-foundry-vtt
                port:
                  number: 80
      - equal:
          path: spec.tls[0]
          value:
            hosts: [vtt.example.com, foundry.example.com]
            secretName: vtt-foundry-vtt-tls

  - it: renders the nginx configuration snippet with templates
    set:
      ingress.enabled: true
      foundryvtt.hostname: vtt.example.com
      ingress.configurationSnippet: |
        more_set_input_headers "X-Forwarded-Host: {{ .Values.foundryvtt.hostname }}";
    asserts:
      - equal:
          path: metadata.annotations["nginx.ingress.kubernetes.io/configuration-snippet"]
          value: |
            more_set_input_headers "X-Forwarded-Host: vtt.example.com";
