suite: secrets
templates:
  - secrets.yaml
release:
  name: vtt
tests:
  - it: requires an admin password
    asserts:
      - failedTemplate:
          errorMessage: foundryvtt.adminPassword is required (or use foundryvtt.existingSecret)

  - it: requires a password with a username
    set:
      foundryvtt.adminPassword: admin
      foundryvtt.username: user
    asserts:
      - failedTemplate:
          errorMessage: foundryvtt.password is required with foundryvtt.username

  - it: stores account credentials
    set:
      foundryvtt.adminPassword: admin
      foundryvtt.username: user
      foundryvtt.password: pass
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: data.username
          value: dXNlcg==
      - equal:
          path: data.password
          value: cGFzcw==
      - notExists:
          path: data.licenseKey

  - it: stores a license key
    set:
      foundryvtt.adminPassword: admin
      foundryvtt.licenseKey: AAAA-BBBB
    asserts:
      - exists:
          path: data.licenseKey
      - notExists:
          path: data.username

  - it: creates no Secret with an existing one
    set:
      foundryvtt.existingSecret: my-foundry
    asserts:
      - hasDocuments:
          count: 0

  - it: creates the AWS credentials Secret for S3
    set:
      foundryvtt.adminPassword: admin
      foundryvtt.s3.enabled: true
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: metadata.name
          value: vtt-foundry-vtt-aws
        documentIndex: 1
