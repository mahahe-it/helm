# Default values for foundry-vtt.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# -- Name Override
# @section -- Common Parameters
nameOverride: ""
# -- FullName Override
# @section -- Common Parameters
fullnameOverride: ""
# -- Override for FoundryVTT DNS Configuration
# @section -- Common Parameters
dnsConfig: {}
# -- Pod hostname, fixed so the Foundry license binding survives restarts (defaults to the release fullname)
# @section -- Common Parameters
podHostname: ""
# -- Extra environment variables for the container (list of EnvVar)
# @section -- Common Parameters
extraEnv: []
serviceAccount:
  # Specifies whether a service account should be created
  # -- Enable ServiceAccount Creation
  # @section -- Common Parameters
  create: false
  # Annotations to add to the service account
  # -- Extra annotations to add to the ServiceAccount
  # @section -- Common Parameters
  annotations: {}
    # AWS EKS IAM Role for Service Account, for awsConfig: true S3 access.
    # https://docs.aws.amazon.com/eks/latest/userguide/create-service-account-iam-policy-and-role.html
    # "eks.amazonaws.com/role-arn": "arn:aws:iam::ACCOUNTID:role/ROLE"
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  # -- Name of the Service Account
  # @section -- Common Parameters
  name:

resources:
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  requests:
    # -- Percentile of CPU Requested to run
    # @section -- Common Parameters
    cpu: 500m
    # -- RAM Requested to run
    # @section -- Common Parameters
    memory: 512Mi
  limits:
    # -- Maximum CPU allowed
    # @section -- Common Parameters
    cpu: 1000m
    # -- Maximum RAM allowed
    # @section -- Common Parameters
    memory: 1024Mi

podSecurityContext:
  # -- The image runs as the non-root `node` user
  # @section -- Common Parameters
  runAsNonRoot: true
  # -- UID of the `node` user in the image
  # @section -- Common Parameters
  runAsUser: 1000
  # -- GID of the `node` user in the image
  # @section -- Common Parameters
  runAsGroup: 1000
  # -- Group that owns the data volume, so the `node` user can write to it (also fixes volumes created by chart versions before 1.0.0)
  # @section -- Common Parameters
  fsGroup: 1000
  # -- Only change volume ownership when the root of the volume does not match
  # @section -- Common Parameters
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    # -- Seccomp profile
    # @section -- Common Parameters
    type: RuntimeDefault
securityContext:
  # -- Allow privilege escalation
  # @section -- Common Parameters
  allowPrivilegeEscalation: false
  # -- Read-only root filesystem: Foundry writes to /data and to emptyDir volumes only
  # @section -- Common Parameters
  readOnlyRootFilesystem: true
  capabilities:
    # -- Dropped Linux capabilities
    # @section -- Common Parameters
    drop:
      - ALL
startupProbe:
  # -- Startup probe attempts, 10s apart, before liveness takes over (first start downloads Foundry)
  # @section -- Common Parameters
  failureThreshold: 60
# -- Pod Node selector
# @section -- Common Parameters
nodeSelector: {}
# -- Pod Tolerations
# @section -- Common Parameters
tolerations: []
# -- Pod Affinity
# @section -- Common Parameters
affinity: {}


image:
  # -- pullPolicy for the Image
  # @section -- Image Parameters
  pullPolicy: IfNotPresent
  # -- Repository to take the Image from
  # @section -- Image Parameters
  repository: felddy/foundryvtt
  # -- Image tag, defaults to the chart appVersion
  # @section -- Image Parameters
  tag: ""

# -- Credentials for Docker private repository.
# @section -- Image Parameters
imagePullSecrets: []

foundryvtt:
  ###########################################
  ### All configurations details are provided here: https://foundryvtt.com/article/hosting/
  ### All supported environment variables can be found here: https://github.com/felddy/foundryvtt-docker#environment-variables

  ## Account username or email address for foundryvtt.com. Required for downloading an application distribution.

  # -- Username of the Account who bought the FoundryVTT License
  # @section -- FoundryVTT Configuration
  username: ""
  ## Account password for foundryvtt.com. Required for downloading an application distribution.

  # -- Password of the Account who bought the FoundryVTT License
  # @section -- FoundryVTT Configuration
  password: ""

  ## Existing secret containing either a license key or a username/password combination.
  ## Must contain either a username/password data pair or a licenseKey entry, together with an adminPassword data key
  # -- Type of License to be fetched from the existing secret. Must be either `account` or `licenseKey`. If set to `account`, the `existingSecret` must contain a `username`/`password` data pair. If set to `licenseKey`, the secret must contain a `licenseKey` data entry
  # @section -- FoundryVTT Configuration
  existingLicenseType: "account"
  # -- Name of an existing Secret to fetch the account from. If set, account settings from values are ignored. Must be used in combination with `foundryvtt.existingLicenseType` to fetch the correct data
  # @section -- FoundryVTT Configuration
  existingSecret: ""

  ## The license key to install. e.g.; AAAA-BBBB-CCCC-DDDD-EEEE-FFFF If left unset, a license key will be fetched when using account authentication. If multiple license keys are associated with an account, one will be chosen at random. Specific licenses can be selected by passing in an integer index. The first license key being 1.
  # -- License Key for FoundryVTT. If set the account infos are ignored.
  # @section -- FoundryVTT Configuration
  licenseKey: ""

  ## Admin password. Required
  # -- Admin Password to Access Admin Page
  # @section -- FoundryVTT Configuration
  adminPassword: ""

  ## A custom hostname to use in place of the host machine's public IP address when displaying the address of the game session. This allows for reverse proxies or DNS servers to modify the public address.
  # -- Hostname of FoundryVTT
  # @section -- FoundryVTT Configuration
  hostname: "foundry.domain.com"

  ## The default application language and module which provides the core translation files. Default is "en.core"
  # -- Language to use
  # @section -- FoundryVTT Configuration
  language: en.core

  ## Set to `true` to reduce network traffic by serving minified static JavaScript and CSS files.  Enabling this setting is recommended for most users, but module developers may wish to disable it. Default is `false`.
  # -- Whether to minify static files or not
  # @section -- FoundryVTT Configuration
  minifyStaticFiles: true

  ## Inform the Foundry Server that the software is running behind a reverse proxy on some other port. This allows the invitation links created to the game to include the correct external port.
  # proxyPort: "80"

  # -- Indicates whether the software is running behind a reverse proxy that uses SSL. This allows invitation links and A/V functionality to work as if the Foundry Server had SSL configured directly.
  # @section -- FoundryVTT Configuration
  proxySSL: true

  ## A string path which is appended to the base hostname to serve Foundry VTT content from a specific namespace. For example setting this to demo will result in data being served from http://x.x.x.x:30000/demo/.
  # routePrefix: "/demo"

  ## Credentials for generate the [awsConfig.json](https://foundryvtt.com/article/aws-s3/)
  s3:
    # -- Enable S3 Integration
    # @section -- FoundryVTT Configuration
    enabled: false

    # Set to the name of an existing secret in the same namespace as the release
    # The secret must contain one data entry named aws-credentials.json
    # with value equal to the [AWS config file](https://foundryvtt.com/article/aws-s3/)
    # -- Existing Secret containing a aws-credentials.json data entry, which must contain supported values by FoundryVTT. More Info [Here](https://foundryvtt.com/article/aws-s3/)
    # @section -- FoundryVTT Configuration
    existingSecret: ""
    config:
      # -- Access Key ID
      # @section -- FoundryVTT Configuration
      accessKey: ""
      # -- Secret Access Key
      # @section -- FoundryVTT Configuration
      secretKey: ""
      # -- S3 Bucket Region
      # @section -- FoundryVTT Configuration
      region: ""
      # -- Custom S3 Endpoint, if different from AWS
      # @section -- FoundryVTT Configuration
      endpoint: ""

  ## An absolute or relative path that points towards an SSL key/cert file which is used jointly with the sslCert option to enable SSL and https connections. If both options are provided, the server will start using HTTPS automatically.
  # sslCert: null
  # sslKey: null

  ## Allow Universal Plug and Play to automatically request port forwarding for the Foundry VTT port to your local network address. Default is false.
  # -- Enable UPNP
  # @section -- FoundryVTT Configuration
  upnp: false

  ## Version of Foundry VTT to install (e.g. "14.370"). Leave empty to use the version matching the image.
  # -- Foundry VTT version to install, defaults to the one matching the image
  # @section -- FoundryVTT Configuration
  version: ""

  ## The world startup at system start.
  # -- World to load at startup
  # @section -- FoundryVTT Configuration
  world: ""

service:
  # -- Type of Service to create, defaults to ClusterIP
  # @section -- Service Parameters
  serviceType: ClusterIP
  # -- Port to expose
  # @section -- Service Parameters
  port: 80
  # -- Protocol to use
  # @section -- Service Parameters
  protocol: TCP
  # -- IP to assign to the Service if type LoadBalancer is selected, deprecated
  # @section -- Service Parameters
  loadBalancerIP:
  # -- Range from which to choose the IP to assign to the Service
  # @section -- Service Parameters
  loadBalancerSourceRanges: []
  ## Set the externalTrafficPolicy in the Service to either Cluster or Local
  # -- External Traffic Policy
  # @section -- Service Parameters
  externalTrafficPolicy: Local
  # -- Extra labels to assign to the Service
  # @section -- Service Parameters
  labels: {}
  # Enable TLS for LoadBalancer
  # -- Enable TLS for the Service
  # @section -- Service Parameters
  tls: true
  # -- Extra annotations to assign to the Service
  # @section -- Service Parameters
  annotations: {}

## If set to "-", storageClassName: "", which disables dynamic provisioning
## If undefined (the default) or set to null, no storageClassName spec is
##   set, choosing the default provisioner.  (gp2 on AWS, standard on
##   GKE, AWS & OpenStack)
## enabled is true, then the other parameters are ignored
persistence:
  # -- Enable or Disable Persistence
  # @section -- Persistence Parameters
  enabled: true
  # -- Storage Class to use when creating the Persistent Volume Claim
  # @section -- Persistence Parameters
  storageClass: ""
  # -- Size of the PV to create
  # @section -- Persistence Parameters
  size: 8Gi
  # -- List of ReadAccessModes to use with the PVC
  # @section -- Persistence Parameters
  readAccessModes:
    - ReadWriteOnce
  # -- Name of an existing claim to use instead of creating a new one. If this is set and
  # @section -- Persistence Parameters
  existingClaim: ""

container:
  ## Set a different path to cache downloads of the Foundry distribution archive and speed up subsequent container startups. From v9.255.1 and v10.260.1 the /data/container_cache is created by default this is now enable by default to keep it consistent.
  # -- Path to use when downloading FoundryVTT
  # @section -- Extra Container Configurations
  cache: /data/container_cache

  ## Set a path to a directory of shell scripts to be sourced after Foundry is installed but before it is started. The path should be in /data or another persistent mount point in the container. e.g.; /data/container_patches Patch files are sourced in lexicographic order. CONTAINER_PATCHES are processed after CONTAINER_PATCH_URLS.
  # patches: /data/patches

  ## Set to a space-delimited list of URLs to be sourced after Foundry is installed but before it is started. Patch URLs are sourced in the order specified. CONTAINER_PATCH_URLS are processed before CONTAINER_PATCHES. ⚠️ Only use patch URLs from trusted sources!
  # patchUrls:
  #   - https://www.path.example/z.sh
  #   - https://www.path.example/b.sh

  # -- Normally new `options.json` and `admin.txt` files are generated by the container at each startup.  Setting this to `true` prevents the container from modifying these files when they exist.  If they do not exist, they will be created as normal. Default is false.
  # @section -- Extra Container Configurations
  preserveConfig: false

  # -- Container [TZ database name](https://en.wikipedia.org/wiki/List_of_tz_database_time_zones#List), passed as `TZ`. Default is UTC
  # @section -- Extra Container Configurations
  timezone: UTC

  # -- Set to `true` to enable verbose logging for the container utility scripts. Default is false
  # @section -- Extra Container Configurations
  verbose: false

# -- Host names routed to Foundry by the Ingress and the HTTPRoute. When empty, `ingress.hostname` is used
# @section -- Ingress Parameters
hostnames: []

ingress:
  # -- Enable Ingress creations
  # @section -- Ingress Parameters
  enabled: false
  # -- Single host name, used when `hostnames` is empty (kept for compatibility, prefer `hostnames`)
  # @section -- Ingress Parameters
  hostname: foundry.domain.com
  # -- Ingress Annotations, useful for TLS
  # @section -- Ingress Parameters
  annotations: {}
  # -- FoundryVTT Path
  # @section -- Ingress Parameters
  path: "/"
  # -- Type of Path
  # @section -- Ingress Parameters
  pathType: Prefix

  # configurationSnippet - Add additional Nginx configuration. This example statically sets a header on the ingress.
  # -- Extra NGINX Configuration to add as Annotation
  # @section -- Ingress Parameters
  configurationSnippet: ""
  # configurationSnippet: |
  #   more_set_input_headers "X-Forwarded-Host: {{ .Values.foundryvtt.hostname }}";
  # -- Enable or Disable TLS
  # @section -- Ingress Parameters
  tls: false
  # -- Optional Ingress class name
  # @section -- Ingress Parameters
  className: ""

# Gateway API, the alternative to the Ingress: needs the Gateway API CRDs and
# a Gateway to attach to. TLS is configured on the Gateway listener.
httpRoute:
  # -- Create an HTTPRoute (gateway.networking.k8s.io/v1)
  # @section -- Ingress Parameters
  enabled: false
  # -- Gateways the route attaches to, e.g. `[{name: public, namespace: gateway, sectionName: https}]`; required when enabled
  # @section -- Ingress Parameters
  parentRefs: []
  # -- HTTPRoute annotations
  # @section -- Ingress Parameters
  annotations: {}
