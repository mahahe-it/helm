{{- $secretName := .Values.foundryvtt.existingSecret | default (include "foundry-vtt.fullname" .) }}
{{- $statusPath := printf "%s/api/status" (.Values.foundryvtt.routePrefix | default "" | trimSuffix "/") }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "foundry-vtt.fullname" . }}
  labels:
    {{- include "foundry-vtt.labels" . | nindent 4 }}
spec:
  # One ReadWriteOnce data volume: the old pod must stop before the new one starts
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      {{- include "foundry-vtt.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "foundry-vtt.selectorLabels" . | nindent 8 }}
    spec:
    {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
    {{- end }}
      serviceAccountName: {{ include "foundry-vtt.serviceAccountName" . }}
      # A fixed hostname keeps the Foundry license binding stable across restarts
      hostname: {{ .Values.podHostname | default (include "foundry-vtt.fullname" .) | trunc 63 | trimSuffix "-" }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      dnsPolicy: "ClusterFirst"
      {{- if .Values.dnsConfig }}
      dnsConfig:
        {{- toYaml .Values.dnsConfig | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 30000
              protocol: TCP
          # The first start downloads and installs Foundry: the startup probe
          # gives it time before liveness takes over.
          startupProbe:
            httpGet:
              path: {{ $statusPath }}
              port: http
            periodSeconds: 10
            failureThreshold: {{ .Values.startupProbe.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ $statusPath }}
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: {{ $statusPath }}
              port: http
            periodSeconds: 30
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          env:
          {{- if .Values.container.cache }}
            - name: CONTAINER_CACHE
              value: {{ .Values.container.cache | quote }}
          {{- end }}
          {{- if .Values.container.patches }}
            - name: CONTAINER_PATCHES
              value: {{ .Values.container.patches | quote }}
          {{- end }}
          {{- if .Values.container.patchUrls }}
            - name: CONTAINER_PATCH_URLS
              value: {{ join " " .Values.container.patchUrls | quote }}
          {{- end }}
            - name: CONTAINER_PRESERVE_CONFIG
              value: {{ .Values.container.preserveConfig | quote }}
            - name: TZ
              value: {{ .Values.container.timezone | quote }}
            - name: CONTAINER_VERBOSE
              value: {{ .Values.container.verbose | quote }}
          {{- if or .Values.foundryvtt.username (and .Values.foundryvtt.existingSecret (eq .Values.foundryvtt.existingLicenseType "account")) }}
            - name: FOUNDRY_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: username
            - name: FOUNDRY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: password
          {{- end }}
          {{- if or .Values.foundryvtt.licenseKey (and .Values.foundryvtt.existingSecret (eq .Values.foundryvtt.existingLicenseType "licenseKey")) }}
            - name: FOUNDRY_LICENSE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: licenseKey
          {{- end }}
            - name: FOUNDRY_ADMIN_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: adminPassword
            - name: FOUNDRY_HOSTNAME
              value: {{ .Values.foundryvtt.hostname | quote }}
            - name: FOUNDRY_LANGUAGE
              value: {{ .Values.foundryvtt.language | quote }}
            - name: FOUNDRY_MINIFY_STATIC_FILES
              value: {{ .Values.foundryvtt.minifyStaticFiles | quote }}
          {{- if .Values.foundryvtt.proxyPort }}
            - name: FOUNDRY_PROXY_PORT
              value: {{ .Values.foundryvtt.proxyPort | quote }}
          {{- end }}
            - name: FOUNDRY_PROXY_SSL
              value: {{ .Values.foundryvtt.proxySSL | quote }}
          {{- if .Values.foundryvtt.routePrefix }}
            - name: FOUNDRY_ROUTE_PREFIX
              value: {{ .Values.foundryvtt.routePrefix | quote }}
          {{- end }}
          {{- if .Values.foundryvtt.s3.enabled }}
            - name: FOUNDRY_AWS_CONFIG
              value: "/etc/secretaws/aws-credentials.json"
          {{- end }}
          {{- if .Values.foundryvtt.sslCert }}
            - name: FOUNDRY_SSL_CERT
              value: {{ .Values.foundryvtt.sslCert | quote }}
          {{- end }}
          {{- if .Values.foundryvtt.sslKey }}
            - name: FOUNDRY_SSL_KEY
              value: {{ .Values.foundryvtt.sslKey | quote }}
          {{- end }}
            - name: FOUNDRY_UPNP
              value: {{ .Values.foundryvtt.upnp | quote }}
          {{- if .Values.foundryvtt.version }}
            - name: FOUNDRY_VERSION
              value: {{ .Values.foundryvtt.version | quote }}
          {{- end }}
          {{- if .Values.foundryvtt.world }}
            - name: FOUNDRY_WORLD
              value: {{ .Values.foundryvtt.world | quote }}
          {{- end }}
          {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /data
            # The root filesystem is read-only: Foundry is installed into
            # resources/ from the CONTAINER_CACHE archive at every start.
            - name: resources
              mountPath: /home/node/resources
            - name: tmp
              mountPath: /tmp
          {{- if .Values.foundryvtt.s3.enabled }}
            - name: secret-aws
              mountPath: /etc/secretaws/
              readOnly: true
          {{- end }}
    {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
    {{- end }}
    {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
    {{- end }}
    {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
    {{- end }}
      volumes:
        - name: data
    {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (include "foundry-vtt.fullname" .) }}
    {{- else }}
          emptyDir: {}
    {{- end }}
        - name: resources
          emptyDir: {}
        - name: tmp
          emptyDir: {}
    {{- if .Values.foundryvtt.s3.enabled }}
        - name: secret-aws
          secret:
            secretName: {{ .Values.foundryvtt.s3.existingSecret | default (printf "%s-aws" (include "foundry-vtt.fullname" .)) }}
    {{- end }}
