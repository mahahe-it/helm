{{- if eq .Values.ingress.enabled true }}
{{- $hosts := include "foundry-vtt.hostnames" . | fromYamlArray }}
{{- $fullName := include "foundry-vtt.fullname" . }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ template "foundry-vtt.fullname" . }}
  labels:
    app: {{ template "foundry-vtt.fullname" . }}
    chart: {{ .Chart.Name }}-{{ .Chart.Version }}
    heritage: {{ .Release.Service }}
    release: {{ .Release.Name }}
  annotations:
{{- if .Values.ingress.configurationSnippet }}
    nginx.ingress.kubernetes.io/configuration-snippet: |
      {{- tpl .Values.ingress.configurationSnippet . | nindent 6 }}
{{- end }}
{{- if .Values.ingress.annotations }}
  {{- toYaml .Values.ingress.annotations | nindent 4 }}
{{- end }}
spec:
{{- /* className is the documented value; ingressClassName was read before 1.0.2 */}}
{{- with .Values.ingress.className | default .Values.ingress.ingressClassName }}
  ingressClassName: {{ . }}
{{- end }}
  rules:
    {{- range $hosts }}
    - host: {{ . | quote }}
      http:
        paths:
          - pathType: {{ $.Values.ingress.pathType }}
            path: {{ $.Values.ingress.path }}
            backend:
              service:
                name: {{ $fullName }}
                port:
                  number: {{ $.Values.service.port }}
    {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    - hosts:
        {{- toYaml $hosts | nindent 8 }}
      secretName: {{ $fullName }}-tls
  {{- end }}
{{- end }}
