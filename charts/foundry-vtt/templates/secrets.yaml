{{- if not .Values.foundryvtt.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "foundry-vtt.fullname" . }}
  labels:
    {{- include "foundry-vtt.labels" . | nindent 4 }}
type: Opaque
data:
  adminPassword: {{ required "foundryvtt.adminPassword is required (or use foundryvtt.existingSecret)" .Values.foundryvtt.adminPassword | b64enc }}
  {{- if .Values.foundryvtt.licenseKey }}
  licenseKey: {{ .Values.foundryvtt.licenseKey | b64enc }}
  {{- end }}
  {{- if .Values.foundryvtt.username }}
  username: {{ .Values.foundryvtt.username | b64enc }}
  password: {{ required "foundryvtt.password is required with foundryvtt.username" .Values.foundryvtt.password | b64enc }}
  {{- end }}
{{- end }}
{{- if and .Values.foundryvtt.s3.enabled (not .Values.foundryvtt.s3.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "foundry-vtt.fullname" . }}-aws
  labels:
    {{- include "foundry-vtt.labels" . | nindent 4 }}
type: Opaque
data:
  aws-credentials.json: {{ dict "accessKeyId" .Values.foundryvtt.s3.config.accessKey "secretAccessKey" .Values.foundryvtt.s3.config.secretKey "region" .Values.foundryvtt.s3.config.region "endpoint" .Values.foundryvtt.s3.config.endpoint | toJson | b64enc }}
{{- end }}
